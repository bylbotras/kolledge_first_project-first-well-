<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор языка программирования для новичка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Выбери свой первый язык программирования</h1>
        <div id="quiz-box">
            <div id="question-container">
                <h2 id="question-text">Вопрос загружается...</h2>
                <div id="options-container" class="options"></div>
            </div>
            <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Следующий вопрос</button>
        </div>
        <div id="result-box" class="hidden">
            <h2>Твой идеальный первый язык:</h2>
            <div id="result-content"></div>
            <button class="btn" onclick="restartQuiz()">Пройти заново</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
